[package]
name = "iris_bridge"
version = "0.1.0"
edition = "2021"
description = "IRIS - flutter_rust_bridge API layer for iris_core"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.9.0"
iris_core = { path = "../../iris_core" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
